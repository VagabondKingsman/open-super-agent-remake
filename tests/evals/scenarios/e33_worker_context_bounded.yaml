id: e33_worker_context_bounded
title: Kết quả tool cũ bị chặn lại — một task dài không tự đẩy context lên vô hạn (C8)
area: limits
bots: [Reader]
setup:
  - mcp_tool: {name: big__blob, size: 20000, params: [n]}
script:
  router:Reader:
    - {call: dispatch, args: {goal: "Đọc 14 khối dữ liệu lớn rồi tóm tắt"}}
    - "Đã giao."
  worker:
    - {call: big__blob, args: {n: "1"}}
    - {call: big__blob, args: {n: "2"}}
    - {call: big__blob, args: {n: "3"}}
    - {call: big__blob, args: {n: "4"}}
    - {call: big__blob, args: {n: "5"}}
    - {call: big__blob, args: {n: "6"}}
    - {call: big__blob, args: {n: "7"}}
    - {call: big__blob, args: {n: "8"}}
    - {call: big__blob, args: {n: "9"}}
    - {call: big__blob, args: {n: "10"}}
    - {call: big__blob, args: {n: "11"}}
    - {call: big__blob, args: {n: "12"}}
    - {call: big__blob, args: {n: "13"}}
    - {call: big__blob, args: {n: "14"}}
    - "Tóm tắt: mười bốn khối, mỗi khối 20k chữ."
input: {to: Reader, text: "Đọc hết mười bốn khối rồi tóm tắt"}
actions:
  - wait: idle
expect:
  task_status: done
  mcp_calls: {big__blob: 14}
  result_contains: ["Tóm tắt"]
  worker_context_chars_max: 100000
  messages:
    - {chat: Reader, kind: result, text: "Tóm tắt"}
notes: |
  Mười bốn kết quả 20 000 chữ: nếu giữ hết, lần gọi worker cuối cùng mang ~112 000 chữ và mỗi
  bước lại dài thêm. C8 chỉ giữ nguyên 3 kết quả mới nhất, còn lại cắt về 1 500 chữ, nên lần gọi nào cũng dưới 100 000 chữ; giữ hết thì lần cuối là ~132 000 chữ.
