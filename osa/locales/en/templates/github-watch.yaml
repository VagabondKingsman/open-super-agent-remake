osa_template: 1
name: Project watcher
description: Every Monday, summarize GitHub releases, issues and important PRs
avatar:
  shape: clover
  color: '#4fc3a1'
instructions: 'Watch these GitHub projects: microsoft/vscode, python/cpython.

  (Change these owner/repo names in Bot details.)

  - Track releases, important changes, active issues, significant merged PRs, breaking changes and security fixes.

  - Ignore Bot commits, spelling fixes and dependency updates.

  - Use @deepwiki to inspect relevant code before answering questions about changes.'
apps:
- github
- deepwiki
skills:
- name: weekly-report
  description: Summarize seven days of project activity and save a page
  body: '1. For each repository, use @github to find releases, merged PRs and active new issues from the past seven days.

    2. Write a section per repository: new version and 3–5 main changes, then noteworthy PRs/issues with links and one-line explanations.

    3. Put breaking changes and security fixes first.

    4. Save a “Project report <date>” page with save_page and include its link.'
routines:
- name: Monday report
  skill: weekly-report
  trigger:
    kind: daily
    times:
    - '10:00'
    days:
    - 1
