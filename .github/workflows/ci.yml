name: CI
on:
  push: { branches: [main, i18n-vi] }
  pull_request:

permissions:
  contents: read

concurrency:   # a new push to the same PR/branch cancels the stale run
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --locked   # fails when uv.lock is out of date with pyproject.toml
      - name: Compile and import
        run: |
          uv run python -m compileall -q osa
          uv run python -c "import osa.server"
      - name: Check app manifests
        run: uv run python -m osa.catalog
      - name: Check Bot templates
        run: uv run python -m osa.templates
      - name: Check translations
        run: uv run python -m osa.i18n
      - name: Check bundled AI Native skill sources
        run: uv run python -m osa.skillpacks verify-sources
      - name: Install bubblewrap sandbox
        # 3 test trong tests/test_local_checks.py cần bwrap thật; xvfb cho test_real_chrome. Ubuntu 24.04 chặn user namespace
        # không đặc quyền qua AppArmor, nên mở lại cho runner rồi thử bwrap một lần.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends bubblewrap xvfb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version
          bwrap --unshare-all --die-with-parent --ro-bind / / true
      - name: Check Chrome
        run: google-chrome --version
      - name: Tests
        # OSA_REQUIRE_SANDBOX: sandbox tests must run, not skip.
        # OSA_TEST_CHROME: test_real_chrome must run. Runner không có màn hình nên Chrome không mở được
        # cổng debug (timeout 20 giây); xvfb-run cho nó một màn hình ảo.
        env: { OSA_REQUIRE_SANDBOX: "1", OSA_TEST_CHROME: "1" }
        run: xvfb-run -a uv run pytest -q -rs

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check compose file
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.computer.yaml config --quiet
      - name: Build app image
        run: docker build -t open-super-agent:ci .
      - name: Smoke test
        run: |
          docker run -d --name osa -p 127.0.0.1:8765:8765 -e OSA_BIND=127.0.0.1 open-super-agent:ci
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:8765/manifest.json >/dev/null && up=1 && break; sleep 1; done
          test "${up:-}" = 1 || { echo "server did not answer within 60s"; exit 1; }
          curl -sf http://127.0.0.1:8765/api/bootstrap | grep -q '"bots"'
          docker exec osa sh -c 'node --version && npx --version && uvx --version && docker --version'
      - name: Server logs
        if: failure()
        run: docker logs osa || true
