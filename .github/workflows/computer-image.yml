name: Computer image
on:
  push:
    branches: [main, i18n-vi]
    paths: ["osa/computer/image/**", ".github/workflows/computer-image.yml"]
  pull_request:
    paths: ["osa/computer/image/**", ".github/workflows/computer-image.yml"]

permissions:
  contents: read

concurrency:
  group: computer-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build computer image
        run: docker build -t osa-computer:ci osa/computer/image
      - name: Desktop starts under no-new-privileges, a pids limit and dropped caps
        run: |
          docker run -d --name computer --shm-size=1g --security-opt no-new-privileges --pids-limit 4096 \
            --cap-drop NET_RAW --cap-drop MKNOD osa-computer:ci
          for _ in $(seq 1 60); do docker exec computer sh -c 'DISPLAY=:1 xdotool getdisplaygeometry' && up=1 && break; sleep 1; done
          test "${up:-}" = 1 || { echo "desktop did not start within 60s"; exit 1; }
      - name: Container logs
        if: failure()
        run: docker logs computer || true
