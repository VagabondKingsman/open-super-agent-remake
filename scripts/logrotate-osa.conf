# Cài bằng root: install -m 0644 scripts/logrotate-osa.conf /etc/logrotate.d/osa
# systemd append: log nên phải copytruncate (app không nhận tín hiệu mở lại file).
__LOGDIR__/*.log {
    daily
    rotate 14
    maxsize 20M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    su boxes boxes
}
